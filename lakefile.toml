name = "hex-hensel"
defaultTargets = ["HexHensel"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPolyFp"
git = "https://github.com/leanprover/hex-poly-fp.git"
rev = "e65c0bd159f0573234bac1760ab43cb189304dec"

[[require]]
name = "HexPolyZ"
git = "https://github.com/leanprover/hex-poly-z.git"
rev = "90b63463fe66286baf70e8c6594efc2f202aee03"

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "6ad58796dca6bae4936003412816e4e844055558"

[[lean_lib]]
name = "HexHensel"
precompileModules = true
