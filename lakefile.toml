name = "hex-hensel"
defaultTargets = ["HexHensel"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPolyFp"
git = "https://github.com/leanprover/hex-poly-fp.git"
rev = "1a21ec21624b3353559d0d6f386e5d5f24ccbc62"

[[require]]
name = "HexPolyZ"
git = "https://github.com/leanprover/hex-poly-z.git"
rev = "6d06e29656068186a94eafc92d3325880294bb16"

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "2d7f55d190cc2df9c9bf55437f344e65fbddc7c0"

[[lean_lib]]
name = "HexHensel"
precompileModules = true
