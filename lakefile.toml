name = "hex-hensel"
defaultTargets = ["HexHensel"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "v0.9.0"

[[require]]
name = "HexPoly"
git = "https://github.com/leanprover/hex-poly.git"
rev = "v0.9.0"

[[require]]
name = "HexPolyFast"
git = "https://github.com/leanprover/hex-poly-fast.git"
rev = "v0.9.0"

[[require]]
name = "HexModArith"
git = "https://github.com/leanprover/hex-mod-arith.git"
rev = "v0.9.0"

[[require]]
name = "HexPolyFp"
git = "https://github.com/leanprover/hex-poly-fp.git"
rev = "v0.9.0"

[[require]]
name = "HexPolyZ"
git = "https://github.com/leanprover/hex-poly-z.git"
rev = "v0.9.0"

[[lean_lib]]
name = "HexHensel"
precompileModules = true
