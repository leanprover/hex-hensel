name = "hex-hensel-conformance"
defaultTargets = ["HexHenselConformance", "hexhensel_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexHensel"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "85ab4582fbe0d86bb38f5429b17b9154fede75f0"

[[lean_lib]]
name = "HexHenselConformance"
globs = ["HexHensel.Conformance", "HexHensel.CrossCheck"]

[[lean_exe]]
name = "hexhensel_emit_fixtures"
root = "HexHensel.EmitFixtures"
